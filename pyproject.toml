[project]
name = "python-ppt-workbench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["python-pptx>=1.0,<2", "Pillow>=10,<14"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code*"]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
